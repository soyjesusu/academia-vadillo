<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ingresar - Academia Vadillo</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f4;--panel:#fff;--ink:#1a2b3c;--mute:#5c6d7c;--line:#d3dcd8;--acc:#1d6b4f;--acc2:#154f3a;--warn:#b4232a}
@media (prefers-color-scheme:dark){:root{--bg:#101a17;--panel:#16231f;--ink:#e6efeb;--mute:#97aaa2;--line:#2a3d36;--acc:#4fc79a;--acc2:#7ad8b4;--warn:#ff8a8f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding:18px}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px 24px}
h1{font:600 26px/1.2 "IBM Plex Serif",Georgia,serif;margin:0 0 6px}
p.sub{margin:0 0 18px;color:var(--mute);font-size:15px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.main{width:100%;margin-top:18px;padding:13px;border:0;border-radius:7px;background:var(--acc);color:#fff;font:600 17px "IBM Plex Sans",sans-serif;cursor:pointer}
@media (prefers-color-scheme:dark){button.main{color:#08261c}}
button.main:hover{background:var(--acc2)}button.main:disabled{opacity:.6;cursor:wait}
button.link{background:none;border:0;color:var(--acc);font:inherit;font-size:15px;cursor:pointer;padding:0;margin-top:14px;text-decoration:underline}
#msg{margin-top:14px;font-size:15px;font-weight:600}
#msg.err{color:var(--warn)}#msg.ok{color:var(--acc)}
.cursos a{display:block;margin-top:10px;padding:13px;border:1px solid var(--acc);border-radius:7px;color:var(--acc);text-decoration:none;font-weight:600;text-align:center}
.cursos a:hover{background:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.cursos a:hover{color:#08261c}}
.hidden{display:none}
</style>
</head>
<body>
<main class="card">
  <h1>Academia Vadillo</h1>
  <p class="sub">Ingresa con tu correo y la clave que creaste.</p>

  <form id="f" novalidate>
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="clave">Clave</label>
    <input id="clave" type="password" autocomplete="current-password" required>
    <button class="main" id="btn" type="submit">Entrar</button>
    <button class="link" id="olvide" type="button">Olvidé mi clave o aún no la he creado</button>
  </form>

  <div id="elegir" class="hidden">
    <p class="sub" style="margin-top:6px">Elige tu curso:</p>
    <div class="cursos" id="lista"></div>
    <button class="link" id="salir" type="button" style="margin-top:20px">Cerrar sesión</button>
  </div>

  <div id="msg" role="status"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAbHMbkIZi7_2zh1tkl2rVopAr0bsAzcfU",
  authDomain: "academiavadillo.firebaseapp.com",
  projectId: "academiavadillo",
  storageBucket: "academiavadillo.firebasestorage.app",
  messagingSenderId: "105199417873",
  appId: "1:105199417873:web:519b1901bb35acf3390fb0"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
const $ = id => document.getElementById(id);

/* Catálogo completo de los 4 cursos de la academia mapeados con sus archivos HTML */
const CURSOS = {
  "contabilidad": { pagina: "contabilidad.html", nombre: "Contabilidad Básica" },
  "cashea": { pagina: "cashea.html", nombre: "Cashea de Vadillo" },
  "excel": { pagina: "excel.html", nombre: "Excel para Contadores" },
  "contribuyente ordinario especial": { pagina: "contribuyente.html", nombre: "Contribuyente Ordinario y Especial" }
};

const msg = (t, tipo) => { $("msg").textContent = t || ""; $("msg").className = tipo || ""; };

/* Lee la inscripción del alumno y gestiona el acceso */
async function entrar(user) {
  const email = (user.email || "").trim().toLowerCase();
  let snap = await db.collection("alumnos").doc(email).get();
  if (!snap.exists && user.email !== email) snap = await db.collection("alumnos").doc(user.email).get();
  const lista = snap.exists && Array.isArray(snap.data().cursos) ? snap.data().cursos : [];
  const activos = lista.map(c => String(c).trim().toLowerCase()).filter(c => CURSOS[c]);

  if (!activos.length) {
    await auth.signOut();
    msg("Tu cuenta existe, pero aún no tienes un curso activo. Si ya pagaste, escríbenos para activarlo.", "err");
    return;
  }
  if (activos.length === 1) { location.href = CURSOS[activos[0]].pagina; return; }
  $("f").classList.add("hidden"); $("elegir").classList.remove("hidden"); msg("");
  $("lista").innerHTML = activos.map(c => `<a href="${CURSOS[c].pagina}">${CURSOS[c].nombre}</a>`).join("");
}

/* Si ya había sesión iniciada */
auth.onAuthStateChanged(u => { if (u && !$("btn").disabled) entrar(u).catch(() => {}); });

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("email").value.trim(), clave = $("clave").value;
  if (!email || !clave) return msg("Escribe tu correo y tu clave.", "err");
  $("btn").disabled = true; msg("Verificando…", "ok");
  try {
    const cred = await auth.signInWithEmailAndPassword(email, clave);
    await entrar(cred.user);
  } catch (err) {
    const t = {
      "auth/invalid-credential": "Correo o clave incorrectos.",
      "auth/wrong-password": "Correo o clave incorrectos.",
      "auth/user-not-found": "No encontramos una cuenta con ese correo.",
      "auth/invalid-email": "El correo no es válido.",
      "auth/too-many-requests": "Demasiados intentos. Espera unos minutos e intenta de nuevo.",
      "permission-denied": "No se pudo leer tu inscripción (permisos). Avísanos."
    };
    msg(t[err.code] || "No se pudo ingresar: " + (err.code || err.message), "err");
  }
  $("btn").disabled = false;
});

/* Crear o recuperar clave: envía un correo con el enlace */
$("olvide").addEventListener("click", async () => {
  const email = $("email").value.trim();
  if (!email) return msg("Escribe tu correo arriba y vuelve a pulsar este enlace.", "err");
  try {
    await auth.sendPasswordResetEmail(email);
    msg("Si ese correo está registrado, te enviamos un enlace para crear o cambiar tu clave. Revisa también el spam.", "ok");
  } catch (err) { msg("No se pudo enviar el correo. Verifica que esté bien escrito.", "err"); }
});

$("salir").addEventListener("click", async () => {
  await auth.signOut(); location.reload();
});
</script>
</body>
</html>
